name: Bug report
description: Report a problem with a Kestrel Labs app
title: "[bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      description: Which project is affected?
      options:
        - kestrel-app-manager
        - kestrel-backup
        - wgclient
        - kestrel-cloud
        - kestrel-catalog
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.0.0 or git commit
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Distro / OS + version
      placeholder: e.g. Kubuntu 24.04, Plasma 6.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. …\n2. …\n3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logs (redact secrets) or describe what you see.
    validations:
      required: false
